<div class="container">
  <h1>Game Options</h1>
  <form (submit)="onSubmit($event)">
    <div class="form-field">
      <label for="tiles">Amount of tiles</label>
      <input type="number" id="tiles" [(ngModel)]="tileCount" name="tiles">
    </div>
    <input type="submit" value="Submit" class="btn-submit">
  </form>
</div>
